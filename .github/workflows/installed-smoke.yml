name: Installed package smoke

on:
  workflow_dispatch:
    inputs:
      index:
        description: Package index containing version 0.1.0
        required: true
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create a fresh virtual environment
        shell: bash
        run: |
          uv venv .smoke-venv --python "${{ matrix.python-version }}" --seed
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo 'SMOKE_PY=.smoke-venv/Scripts/python.exe' >> "$GITHUB_ENV"
          else
            echo 'SMOKE_PY=.smoke-venv/bin/python' >> "$GITHUB_ENV"
          fi
      - name: Install the published package
        shell: bash
        env:
          PACKAGE_INDEX: ${{ inputs.index }}
        run: |
          if [[ "$PACKAGE_INDEX" == "testpypi" ]]; then
            "$SMOKE_PY" -m pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ 'strands-lancedb-memory==0.1.0'
          else
            "$SMOKE_PY" -m pip install --index-url https://pypi.org/simple/ 'strands-lancedb-memory==0.1.0'
          fi
      - name: Exercise the installed wheel and offline Agent example
        shell: bash
        run: |
          "$SMOKE_PY" -I scripts/installed_smoke.py
          "$SMOKE_PY" -I examples/local_agent.py
