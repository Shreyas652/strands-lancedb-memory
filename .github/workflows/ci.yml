name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --dev
      - run: uv run ruff check src tests evals experiments scripts examples
      - run: uv run ruff format --check src tests evals experiments scripts examples
      - run: uv run mypy --strict src/strands_lancedb_memory
      - run: uv run python scripts/check_no_secrets.py
      - run: uv run python scripts/check_reported_numbers.py
      - run: uv run python scripts/check_artifact_integrity.py
      - run: uv run pytest tests --cov=strands_lancedb_memory --cov-fail-under=90

  compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
        profile: [minimum, newest-2026-11-25]
        include:
          - profile: minimum
            strands: '1.65.0'
            lancedb: '0.41.0'
            pyarrow: '26.0.0'
            filelock: '3.20.0'
          - profile: newest-2026-11-25
            strands: '1.67.0'
            lancedb: '0.41.0'
            pyarrow: '26.0.1'
            filelock: '4.3.1'
    name: compat (${{ matrix.profile }}, Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv venv .compat-venv --python ${{ matrix.python-version }}
      - name: Install selected runtime versions without the benchmark lock
        run: >-
          uv pip install --python .compat-venv/bin/python -e .
          "strands-agents==${{ matrix.strands }}"
          "lancedb==${{ matrix.lancedb }}"
          "pyarrow==${{ matrix.pyarrow }}"
          "filelock==${{ matrix.filelock }}"
          "pytest==9.2.0" "hypothesis==6.170.17"
      - run: .compat-venv/bin/python -m pytest tests/test_store.py -q
