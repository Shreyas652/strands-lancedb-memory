[project]
name = "strands-lancedb-memory"
version = "0.1.0"
description = "Embedded, tenant-scoped LanceDB memory store for Strands Agents"
readme = "README.md"
requires-python = ">=3.11, <3.14"
dependencies = [
    "filelock>=3.20,<4",
    "lancedb==0.41.0",
    "pyarrow==26.0.1",
    "strands-agents==1.65.0",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.17",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]
